name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run tests
        run: python3 tests/test_lite.py
      - name: Smoke run (missing file must exit 1)
        run: |
          set +e
          python3 src/faceless_qc_lite.py missing.mp4
          code=$?
          set -e
          echo "exit code was $code"
          test $code -eq 1
